name: "מבוא למדעי הנתונים"
description: "קורס המקנה כלים בסיסיים לניתוח נתונים, ויזואליזציה ולמידת מכונה בסיסית."
instructor: "דניס דן כספא"
target_audience: "סטודנטים שנה ב' עם רקע בתכנות"
language: "he"
prerequisites:
  - "מבוא למדעי המחשב"
  - "הסתברות וסטטיסטיקה"

topics:
  - name: "ניתוח נתונים עם Pandas"
    description: "שימוש בספריית Pandas לניתוח ועיבוד נתונים"
    subtopics:
      - "DataFrame ו-Series"
      - "קריאת נתונים ממקורות שונים"
      - "סינון ובחירת נתונים"
      - "קיבוץ ואגרגציה"
      - "טיפול בנתונים חסרים"
    key_concepts:
      - "DataFrame"
      - "Series"
      - "אינדקס"
      - "אגרגציה"
      - "נתונים חסרים"
    learning_objectives:
      - "לטעון ולנקות נתוני גלם"
      - "לבצע שאילתות על נתונים"
      - "לבצע ניתוחים סטטיסטיים בסיסיים"

  - name: "ויזואליזציה של נתונים"
    description: "יצירת גרפים ותרשימים להצגת נתונים"
    subtopics:
      - "Matplotlib יסודות"
      - "Seaborn לגרפים סטטיסטיים"
      - "סוגי גרפים ומתי להשתמש בהם"
      - "עיצוב והתאמת גרפים"
    key_concepts:
      - "היסטוגרמה"
      - "גרף פיזור"
      - "גרף קופסה"
      - "מפת חום"
    learning_objectives:
      - "לבחור את סוג הגרף המתאים"
      - "ליצור ויזואליזציות ברורות"
      - "להציג ממצאים ויזואלית"

  - name: "למידת מכונה בסיסית"
    description: "מבוא לאלגוריתמים בסיסיים של למידת מכונה"
    subtopics:
      - "למידה מונחית vs לא מונחית"
      - "רגרסיה ליניארית"
      - "סיווג (Classification)"
      - "אשכולות (Clustering)"
      - "הערכת מודלים"
    key_concepts:
      - "רגרסיה"
      - "סיווג"
      - "אימון ובדיקה"
      - "overfitting"
      - "cross-validation"
    learning_objectives:
      - "להבין את סוגי הלמידה"
      - "לבנות מודלים בסיסיים עם scikit-learn"
      - "להעריך ביצועי מודלים"
