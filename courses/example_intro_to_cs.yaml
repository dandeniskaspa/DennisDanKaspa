name: "מבוא למדעי המחשב"
description: "קורס מבוא המקנה את הבסיס למדעי המחשב, כולל חשיבה אלגוריתמית, תכנות בפייתון, ומבני נתונים בסיסיים."
instructor: "דניס דן כספא"
target_audience: "סטודנטים שנה א' למדעי המחשב"
language: "he"
prerequisites:
  - "מתמטיקה ברמת בגרות 5 יחידות"

topics:
  - name: "מבוא לחשיבה אלגוריתמית"
    description: "הבנת מהות האלגוריתם וכיצד לפרק בעיות לצעדים"
    subtopics:
      - "מהו אלגוריתם"
      - "תרשימי זרימה"
      - "פסאודו-קוד"
      - "ניתוח בעיות"
    key_concepts:
      - "אלגוריתם"
      - "קלט ופלט"
      - "תרשים זרימה"
      - "פסאודו-קוד"
    learning_objectives:
      - "להגדיר מהו אלגוריתם"
      - "לבנות תרשים זרימה לבעיה נתונה"
      - "לכתוב פסאודו-קוד"

  - name: "יסודות פייתון"
    description: "לימוד שפת התכנות פייתון מהיסודות"
    subtopics:
      - "משתנים וטיפוסים"
      - "פעולות אריתמטיות ולוגיות"
      - "תנאים (if/else)"
      - "לולאות (for/while)"
      - "פונקציות"
    key_concepts:
      - "משתנה"
      - "טיפוס נתונים"
      - "ביטוי בוליאני"
      - "לולאה"
      - "פונקציה"
      - "פרמטר וארגומנט"
    learning_objectives:
      - "לכתוב תוכניות פייתון בסיסיות"
      - "להשתמש בתנאים ולולאות"
      - "להגדיר ולהשתמש בפונקציות"

  - name: "מבני נתונים בסיסיים"
    description: "הכרת מבני הנתונים הבסיסיים בפייתון"
    subtopics:
      - "רשימות (Lists)"
      - "מילונים (Dictionaries)"
      - "קבוצות (Sets)"
      - "טאפלים (Tuples)"
      - "מחרוזות כמבנה נתונים"
    key_concepts:
      - "רשימה"
      - "מילון"
      - "אינדקס"
      - "מפתח-ערך"
      - "איטרציה"
    learning_objectives:
      - "לבחור את מבנה הנתונים המתאים לבעיה"
      - "לבצע פעולות על רשימות ומילונים"
      - "להבין סיבוכיות בסיסית של פעולות"

  - name: "קבצים וטיפול בשגיאות"
    description: "עבודה עם קבצים וטיפול בחריגות"
    subtopics:
      - "קריאה מקבצים"
      - "כתיבה לקבצים"
      - "פורמטים נפוצים (CSV, JSON)"
      - "חריגות (Exceptions)"
      - "try/except"
    key_concepts:
      - "קובץ"
      - "נתיב"
      - "חריגה"
      - "try/except"
      - "context manager"
    learning_objectives:
      - "לקרוא ולכתוב קבצים בפייתון"
      - "לטפל בשגיאות בצורה נכונה"
      - "לעבוד עם פורמטים נפוצים"

  - name: "תכנות מונחה עצמים"
    description: "מבוא לפרדיגמת התכנות מונחה העצמים"
    subtopics:
      - "מחלקות ואובייקטים"
      - "תכונות ומתודות"
      - "בנאי (__init__)"
      - "ירושה"
      - "אנקפסולציה"
    key_concepts:
      - "מחלקה"
      - "אובייקט"
      - "מתודה"
      - "ירושה"
      - "אנקפסולציה"
      - "פולימורפיזם"
    learning_objectives:
      - "להגדיר מחלקות ולייצר אובייקטים"
      - "להשתמש בירושה"
      - "להבין את עקרונות OOP"
